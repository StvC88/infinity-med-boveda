name: Windows verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - run: python -m pip install -r requirements.txt PyInstaller==6.22.3 pyinstaller-hooks-contrib==2026.9
      - run: python -m unittest -v test_vault test_ui test_improvements test_password_security test_release_security
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m PyInstaller --noconfirm --distpath dist --workpath build BovedaLocal.spec
      - name: Test frozen application
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/InfinityMedBoveda-v2.1.exe).Path
          $result = Join-Path $env:RUNNER_TEMP 'infinity-selftest.json'
          $p = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', $result) -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(60000)) { throw 'Executable self-test timeout' }
          if ($p.ExitCode -ne 0) { throw 'Executable self-test failed' }
          $report = Get-Content -LiteralPath $result -Raw | ConvertFrom-Json
          foreach ($key in @('gui_started','frozen','crypto_roundtrip','full_rotation','cleanup_disabled','previous_vault_preserved')) {
            if ($report.$key -ne $true) { throw "Missing executable verification: $key" }
          }
          if ($report.pointer_bits -ne 64 -or $report.error) { throw 'Invalid executable verification report' }
          Get-Content -LiteralPath $result
      - name: Checksums
        shell: pwsh
        run: Get-FileHash dist/*.exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: infinity-med-windows-x64
          path: dist/
